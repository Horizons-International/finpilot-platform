name: Backend CI

on:
  pull_request:
    branches:
      - main
      - master

  push:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: customers_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user -d customers_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check .

      - name: Black
        run: uv run black --check .

      - name: MyPy
        run: uv run mypy .

      - name: Pytest
        run: uv run pytest tests/unit
        env:
          DATABASE_URL: postgresql+psycopg://user:123789@postgres:5432/customers

      - name: Integration tests
        env:
          DATABASE_URL: postgresql+psycopg://user:123789@localhost:5432/customers
          SECRET_KEY: test-secret-key
        run: uv run pytest tests/integration
        
