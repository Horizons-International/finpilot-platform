name: Deploy Existing FinPilot Release

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment to deploy to (the GitHub Environment must be configured)
        required: true
        type: choice
        options:
          - development
          - testing
          - staging
          - production
      release_tag:
        description: Exact published GHCR tag (full commit SHA or vMAJOR.MINOR.PATCH tag)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: finpilot-manual-deploy-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify requested image exists in GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    outputs:
      image_name: ${{ steps.image.outputs.name }}
      release_tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Validate release tag
        id: release
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$ || "${RELEASE_TAG,,}" == "latest" || "${RELEASE_TAG,,}" == "stable" ]]; then
            echo "Invalid release tag. Use a published Git SHA or vMAJOR.MINOR.PATCH tag, not latest/stable." >&2
            exit 2
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull requested image
        run: docker pull "${{ steps.image.outputs.name }}:${{ steps.release.outputs.tag }}"

  deploy:
    name: Deploy approved release
    needs: [verify-release]
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: read
    environment:
      name: ${{ inputs.target_environment }}
    concurrency:
      group: finpilot-deploy-${{ inputs.target_environment }}
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      FINPILOT_IMAGE: ${{ needs.verify-release.outputs.image_name }}
      RELEASE_TAG: ${{ needs.verify-release.outputs.release_tag }}
      TARGET_ENV: ${{ inputs.target_environment }}
    steps:
      - name: Checkout deployment assets
        uses: actions/checkout@v7
      - name: Deploy over verified SSH
        run: bash deploy/scripts/deploy-over-ssh.sh
