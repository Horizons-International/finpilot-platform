services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - finpilot_storage:/app/storage
    depends_on:
      - postgres

  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: customers
      POSTGRES_USER: user
      POSTGRES_PASSWORD: "123789"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  sla-monitor:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: sla-monitor
    env_file:
      - .env
    command:
      [
        "uv",
        "run",
        "python",
        "-m",
        "app.jobs.sla_monitor"
      ]
    depends_on:
      - postgres
    restart: unless-stopped

  analytics-aggregator:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: analytics-aggregator
    env_file:
      - .env
    command:
      [
        "uv",
        "run",
        "python",
        "-m",
        "app.jobs.analytics_aggregator"
      ]
    depends_on:
      - postgres
    restart: unless-stopped

  report-export-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: report-export-worker
    env_file:
      - .env
    volumes:
      - finpilot_storage:/app/storage
    command:
      [
        "uv",
        "run",
        "python",
        "-m",
        "app.jobs.report_export_worker"
      ]
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
  finpilot_storage: