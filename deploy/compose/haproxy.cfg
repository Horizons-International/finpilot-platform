global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option forwardfor
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout http-request 10s
    retries 2
    option redispatch

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold nx 3s
    hold timeout 3s
    accepted_payload_size 8192

frontend finpilot_http
    bind :8080
    default_backend finpilot_api

backend finpilot_api
    balance roundrobin
    option httpchk GET /ready
    http-check expect status 200
    default-server inter 3s fall 3 rise 2
    server backend_1 backend:8000 check resolvers docker init-addr libc,none
    server backend_2 backend-2:8000 check resolvers docker init-addr libc,none
    server backend_3 backend-3:8000 check resolvers docker init-addr libc,none

listen stats
    bind :8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
